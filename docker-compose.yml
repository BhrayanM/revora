# =============================================================================
# Revora / AI Growth Platform — Production Docker Compose
# =============================================================================
# Architecture Note:
# Database, Auth, Storage, and Realtime are managed by Supabase (Cloud / Managed).
# The production containerized service is the Next.js standalone application only.
# No local raw PostgreSQL database is spun up in production.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-growth-platform
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 || r.statusCode === 307 || r.statusCode === 308 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
