name: Security Audit

on:
  schedule:
    # Every Monday at 07:00 UTC (02:00 CST)
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Read-only: this workflow only reads the repo and audit registry.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (moderate+)
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages (informational)
        run: npm outdated || true

      - name: Write audit summary
        if: always()
        run: |
          echo "## Weekly Security Audit — $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v = data.metadata.vulnerabilities;
            console.log('| Level | Count |');
            console.log('|---|---|');
            console.log('| Critical | ' + v.critical + ' |');
            console.log('| High | ' + v.high + ' |');
            console.log('| Moderate | ' + v.moderate + ' |');
            console.log('| Low | ' + v.low + ' |');
            console.log('| Total | ' + v.total + ' |');
          " >> $GITHUB_STEP_SUMMARY || echo "Could not parse audit JSON" >> $GITHUB_STEP_SUMMARY
